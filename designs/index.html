<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
:root { --bg: #121217; --panel: #1C1C25; --line: #33333F; --fg: #EDEDF2; --muted: #9090A4; --accent: #FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: 'Manrope', system-ui, sans-serif; }
body { display: flex; flex-direction: column; min-height: 100%; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.back { display: inline-flex; align-items: center; height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 700 14px 'Manrope', sans-serif; text-decoration: none; }
.back:hover { border-color: var(--accent); }
.nav-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 20px; cursor: pointer; }
.nav-btn:hover { border-color: var(--accent); }
.current { display: flex; flex-direction: column; min-width: 220px; }
.current small { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: var(--muted); }
.current strong { font-size: 26px; font-weight: 800; line-height: 1.15; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tab { height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 700 13px 'Manrope', sans-serif; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.tab:disabled { opacity: .3; cursor: default; }
main { flex: 1; min-height: 340px; display: flex; align-items: center; justify-content: center; padding: 18px; background: #0B0B0F; }
.stage { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 20px 50px rgba(0,0,0,.55); }
.stage iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #000; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 156px; gap: 10px; padding: 12px 20px 14px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.thumb { display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 10px; border: 2px solid transparent; background: transparent; color: var(--fg); text-align: left; cursor: pointer; font-family: inherit; }
.thumb:hover { background: var(--panel); }
.thumb[aria-current="true"] { border-color: var(--accent); background: var(--panel); }
.thumb .pv { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; background: #000; }
.thumb .pv iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0; transform-origin: 0 0; pointer-events: none; }
.thumb span { font-size: 13px; }
.thumb b { font-weight: 800; margin-right: 6px; }
.thumb em { font-style: normal; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); padding: 0 20px 14px; }
@media (max-width: 700px) { .tabs { margin-left: 0; } .current { min-width: 0; } .current strong { font-size: 20px; } }
</style>

  if (!m) return;
  const n = Number(m[1]) - 1;
  if (n >= 0 && n < DESIGNS.length) d = n;
  if (m[2]) s = m[2];
}
function screenOf() {
  const list = DESIGNS[d].screens;
  return list.find(x => x.id === s) || list.find(x => x.id === 'Leinwand');
}
function fit() {
  const sc = screenOf();
  const box = stage.parentElement.getBoundingClientRect();
  const f = Math.min((box.width - 36) / sc.w, (box.height - 36) / sc.h, 1);
  stage.style.width = Math.round(sc.w * f) + 'px';
  stage.style.height = Math.round(sc.h * f) + 'px';
  frame.style.width = sc.w + 'px';
  frame.style.height = sc.h + 'px';
  frame.style.transform = 'scale(' + f + ')';
}
function show() {
  const sc = screenOf();
  s = sc.id;
  const des = DESIGNS[d];
  $('num').textContent = 'RICHTUNG ' + String(d + 1).padStart(2, '0') + ' / ' + DESIGNS.length;
  $('name').textContent = des.key + ' · ' + des.name;
  if (frame.getAttribute('src') !== sc.file) frame.setAttribute('src', sc.file);
  $('tabs').querySelectorAll('.tab').forEach(b => {
    const ok = des.screens.some(x => x.id === b.dataset.id);
    b.disabled = !ok;
    b.setAttribute('aria-pressed', String(b.dataset.id === s));
  });
  $('strip').querySelectorAll('.thumb').forEach((b, i) => { b.setAttribute('aria-current', String(i === d)); if (i === d) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
  history.replaceState(null, '', '#' + (d + 1) + '/' + s);
  fit();
}
TABS.forEach(([id, label]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.dataset.id = id; b.textContent = label;
  b.addEventListener('click', () => { s = id; show(); });
  $('tabs').appendChild(b);
});
DESIGNS.forEach((des, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'thumb';
  b.innerHTML = '<div class="pv"><iframe loading="lazy" tabindex="-1" title="" src="' + des.screens.find(x => x.id === 'Leinwand').file + '"></iframe></div><span><b>' + String(i + 1).padStart(2, '0') + '</b><em>' + des.key + ' · ' + des.name + '</em></span>';
  b.addEventListener('click', () => { d = i; show(); });
  $('strip').appendChild(b);
});
function fitThumbs() {
  document.querySelectorAll('.thumb .pv').forEach(pv => {
    const f = pv.getBoundingClientRect().width / 1280;
    pv.querySelector('iframe').style.transform = 'scale(' + f + ')';
  });
}
$('prev').addEventListener('click', () => { d = (d + DESIGNS.length - 1) % DESIGNS.length; show(); });
$('next').addEventListener('click', () => { d = (d + 1) % DESIGNS.length; show(); });
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});
window.addEventListener('resize', () => { fit(); fitThumbs(); });
window.addEventListener('hashchange', () => { readHash(); show(); });
readHash(); show(); fitThumbs();
</script>
</body>
</html>
