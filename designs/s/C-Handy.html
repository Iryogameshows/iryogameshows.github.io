<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Pop · Handy Buzzer · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@500;600;700&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFD23F; color: #121212; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 26px 22px 30px; gap: 22px; overflow: hidden">
  <header style="width: 100%; box-sizing: border-box; background: #FFFFFF; border: 3px solid #121212; border-radius: 18px; box-shadow: 5px 5px 0 #121212; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <span style="width: 44px; height: 44px; border-radius: 50%; background: #E8453C; border: 2.5px solid #121212; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 20px">A</span>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Archivo Black', sans-serif; font-size: 20px">Anna</span>
      <span style="font-size: 14px; font-weight: 700; color: #B42318">Team Rot</span>
    </div>
    <span style="font-size: 13px; font-weight: 700; background: #5EE0A6; border: 2px solid #121212; border-radius: 999px; padding: 4px 10px">online</span>
  </header>
  <div style="background: #121212; color: #FFD23F; border-radius: 999px; padding: 10px 22px; font-family: 'Archivo Black', sans-serif; font-size: 18px; transform: rotate(-2deg)">Frage 3 · Buzzer offen</div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px">
    <button type="button" style="width: 270px; height: 270px; border-radius: 50%; border: 5px solid #121212; background: #121212; box-shadow: 0 14px 0 #5C4300; color: #FFD23F; font-family: 'Archivo Black', sans-serif; font-size: 70px; cursor: pointer">BUZZ</button>
    <span style="font-size: 16px; font-weight: 700">Drücken, sobald du die Antwort weißt</span>
  </div>
  <footer style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
    <div style="background: #E8453C; color: #FFFFFF; border: 3px solid #121212; border-radius: 14px; box-shadow: 4px 4px 0 #121212; padding: 6px 14px; display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 14px; font-weight: 700">Rot</span>
      <span style="font-family: 'Archivo Black', sans-serif; font-size: 28px">120</span>
    </div>
    <div style="background: #3B82F6; color: #FFFFFF; border: 3px solid #121212; border-radius: 14px; box-shadow: 4px 4px 0 #121212; padding: 6px 14px; display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 14px; font-weight: 700">Blau</span>
      <span style="font-family: 'Archivo Black', sans-serif; font-size: 28px">85</span>
    </div>
  </footer>
</div>
</body>
</html>
