<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Arcade · Handy Buzzer · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0A12; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 28px 22px 30px; gap: 22px; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 4px); pointer-events: none"></div>
  <header style="width: 100%; display: flex; justify-content: space-between; align-items: center; position: relative; font-family: 'Press Start 2P', monospace">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; color: #E8453C">P1 · ROT</span>
      <span style="font-size: 22px; color: #FFFFFF">ANNA</span>
    </div>
    <span style="font-size: 12px; color: #22C55E">ONLINE</span>
  </header>
  <div style="width: 100%; box-sizing: border-box; border: 3px solid #2EE6D6; padding: 14px; text-align: center; position: relative; display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #9C96B8">FAMILY FEUD · Q3</span>
    <span style="font-family: 'Press Start 2P', monospace; font-size: 18px; color: #2EE6D6">BUZZER OPEN</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; position: relative">
    <div style="width: 300px; height: 300px; border-radius: 50%; background: #2B2740; box-shadow: inset 0 6px 0 #3A3456, 0 10px 0 #000000; display: flex; align-items: center; justify-content: center">
      <button type="button" style="width: 236px; height: 236px; border-radius: 50%; border: none; background: #FF3D9A; box-shadow: inset 0 -16px 0 #B5165F, inset 0 8px 0 #FF7DBE, 0 0 50px rgba(255,61,154,.5); font-family: 'Press Start 2P', monospace; font-size: 30px; color: #FFFFFF; cursor: pointer">PUSH</button>
    </div>
    <span style="font-size: 15px; font-weight: 500; color: #9C96B8">Drücken, sobald du die Antwort weißt</span>
  </div>
  <footer style="width: 100%; display: flex; justify-content: space-between; position: relative; font-family: 'Press Start 2P', monospace; font-size: 14px">
    <span style="color: #E8453C">ROT 0120</span>
    <span style="color: #3B82F6">BLAU 0085</span>
  </footer>
</div>
</body>
</html>
