<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Bauhaus · Menü · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #ECEAE4; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 56px; padding: 56px 64px; overflow: hidden">
  <aside style="display: flex; flex-direction: column; gap: 28px">
    <div style="position: relative; width: 400px; height: 360px">
      <span style="position: absolute; left: 0; top: 0; width: 240px; height: 240px; border-radius: 50%; background: #F2C230"></span>
      <span style="position: absolute; right: 0; top: 70px; width: 190px; height: 190px; background: #1F4FA3"></span>
      <span style="position: absolute; left: 90px; bottom: 0; width: 220px; height: 110px; border-radius: 110px 110px 0 0; background: #D7372B"></span>

    </div>
    <span style="font-weight: 800; font-size: 30px; letter-spacing: 8px">GAMESHOW</span>
    <nav style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      
        <button type="button" style="height: 44px; border: 2px solid #141414; background: transparent; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Bestenliste</button>
      
        <button type="button" style="height: 44px; border: 2px solid #141414; background: transparent; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Spieler</button>
      
        <button type="button" style="height: 44px; border: 2px solid #141414; background: transparent; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Mainscreen</button>
      
        <button type="button" style="height: 44px; border: 2px solid #141414; background: transparent; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Notizen</button>
      
        <button type="button" style="height: 44px; border: 2px solid #141414; background: transparent; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Sound an</button>
      
        <button type="button" style="height: 44px; border: 2px solid #141414; background: transparent; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Töne probehören</button>
      
    </nav>
  </aside>

      <button type="button" style="box-sizing: border-box; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; align-items: center; text-align: left; background: #FFFFFF; border: 2px solid #141414; padding: 0 20px; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; cursor: pointer">
        <span style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="width: 52px; height: 52px; background: #F2C230; border-radius: 50%; clip-path: none"></span></span>

        <span style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 50px; background: #D7372B; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%)"></span></span>

        </span>

      <button type="button" style="box-sizing: border-box; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; align-items: center; text-align: left; background: #FFFFFF; border: 2px solid #141414; padding: 0 20px; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; cursor: pointer">
        <span style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 28px; background: #141414; border-radius: 28px 28px 0 0; clip-path: none"></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px">

        </span>
      </button>
    
      <button type="button" style="box-sizing: border-box; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; align-items: center; text-align: left; background: #FFFFFF; border: 2px solid #141414; padding: 0 20px; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; cursor: pointer">
        <span style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="width: 50px; height: 50px; background: #1F4FA3; border-radius: 50px 0 0 0; clip-path: none"></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px">

        </span>

        <span style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 50px; background: #F2C230; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%)"></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 800; font-size: 26px; line-height: 1.05">Der Preis ist heiß</span>
          <span style="font-weight: 500; font-size: 15px; color: #4A4A4A">Preise schätzen</span>
        </span>
      </button>
    
      <button type="button" style="box-sizing: border-box; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; align-items: center; text-align: left; background: #FFFFFF; border: 2px solid #141414; padding: 0 20px; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; cursor: pointer">
        <span style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="width: 52px; height: 52px; background: #D7372B; border-radius: 50%; clip-path: none"></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 800; font-size: 26px; line-height: 1.05">Trivial Pursuit</span>
          <span style="font-weight: 500; font-size: 15px; color: #4A4A4A">Sechs Tortenstücke</span>
        </span>
      </button>
    
      <button type="button" style="box-sizing: border-box; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; align-items: center; text-align: left; background: #FFFFFF; border: 2px solid #141414; padding: 0 20px; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; cursor: pointer">
        <span style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="width: 46px; height: 46px; background: #141414; border-radius: 0; clip-path: none"></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 800; font-size: 26px; line-height: 1.05">Turnier</span>
