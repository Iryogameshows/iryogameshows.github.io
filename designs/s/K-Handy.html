<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Neon-Bar · Handy Buzzer · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&amp;family=Sora:wght@400;600;700&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #2A191D; background-image: radial-gradient(ellipse 90% 60% at 50% 50%, rgba(42,25,29,.2) 0%, rgba(10,6,8,.9) 100%), linear-gradient(#170D10 3px, transparent 3px), linear-gradient(90deg, #170D10 3px, transparent 3px); background-size: 100% 100%, 100% 40px, 80px 40px; color: #FFF3E0; font-family: 'Sora', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 24px 30px; gap: 18px; overflow: hidden">
  <header style="width: 100%; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Yellowtail', cursive; font-size: 44px; line-height: 1; color: #FFE3F1; text-shadow: 0 0 6px #FF4FA3, 0 0 18px #FF4FA3">Anna</span>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #FFB3AD">TEAM ROT</span>
    </div>
    <span style="font-size: 13px; font-weight: 600; color: #CDBBC1">Frage 3</span>
  </header>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px">
    <div style="width: 290px; height: 290px; border-radius: 50%; border: 4px solid #FFD6EA; box-shadow: 0 0 14px #FF4FA3, 0 0 40px rgba(255,79,163,.6), inset 0 0 14px #FF4FA3, inset 0 0 40px rgba(255,79,163,.35); display: flex; align-items: center; justify-content: center">
      <button type="button" style="width: 230px; height: 230px; border-radius: 50%; border: none; background: rgba(12,7,9,.85); color: #FFE3F1; font-family: 'Yellowtail', cursive; font-size: 92px; text-shadow: 0 0 6px #FF4FA3, 0 0 18px #FF4FA3, 0 0 40px #FF4FA3; cursor: pointer">Buzz</button>
    </div>
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 4px; color: #E6FDFF; text-shadow: 0 0 8px #45F0FF">BUZZER OFFEN</span>
  </div>
  <footer style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="border: 2px solid #FFB3AD; border-radius: 12px; box-shadow: 0 0 10px rgba(232,69,60,.6); background: rgba(12,7,9,.7); padding: 6px 14px; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 600">ROT</span><span style="font-size: 26px; font-weight: 700">120</span></div>
    <div style="border: 2px solid #B9D5FF; border-radius: 12px; box-shadow: 0 0 10px rgba(59,130,246,.6); background: rgba(12,7,9,.7); padding: 6px 14px; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 600">BLAU</span><span style="font-size: 26px; font-weight: 700">85</span></div>
  </footer>
</div>
</body>
</html>
