<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Jazzplatte · Handy Buzzer · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&amp;family=Libre+Franklin:wght@400;600;800&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #111111; color: #F4F1EA; font-family: 'Libre Franklin', sans-serif; display: flex; flex-direction: column; padding: 28px 24px 28px; gap: 16px; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 4px; color: #F2A900">FAMILY FEUD · FRAGE 3</span>
    <span style="font-family: 'Antonio', sans-serif; font-weight: 700; font-size: 72px; line-height: .88; text-transform: uppercase">Anna</span>
    <span style="align-self: flex-start; background: #E8453C; padding: 2px 10px; font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 3px">TEAM ROT</span>
  </header>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div style="width: 330px; height: 330px; border-radius: 50%; background: repeating-radial-gradient(circle, #0A0A0A 0px, #0A0A0A 2px, #1C1C1C 2px, #1C1C1C 3px); box-shadow: 0 18px 40px rgba(0,0,0,.7), inset 0 0 0 1px #2A2A2A; display: flex; align-items: center; justify-content: center">
      <button type="button" style="width: 168px; height: 168px; border-radius: 50%; border: none; background: #F2A900; color: #111111; font-family: 'Antonio', sans-serif; font-weight: 700; font-size: 52px; letter-spacing: 1px; cursor: pointer">BUZZ</button>
    </div>
    <span style="font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 5px">BUZZER OFFEN</span>
  </div>
  <footer style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #E8453C; padding: 6px 12px; display: flex; justify-content: space-between; align-items: flex-end"><span style="font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 2px">ROT</span><span style="font-family: 'Antonio', sans-serif; font-weight: 700; font-size: 34px; line-height: .9">120</span></div>
    <div style="background: #3B82F6; padding: 6px 12px; display: flex; justify-content: space-between; align-items: flex-end"><span style="font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 2px">BLAU</span><span style="font-family: 'Antonio', sans-serif; font-weight: 700; font-size: 34px; line-height: .9">85</span></div>
  </footer>
</div>
</body>
</html>
