<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Riso · Handy Buzzer · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&amp;family=Familjen+Grotesk:wght@500;700&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F2EEE4; color: #3255A4; font-family: 'Familjen Grotesk', sans-serif; overflow: hidden">
  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 28px 24px 28px; gap: 16px">
    <header style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Bowlby One', sans-serif; font-size: 46px; line-height: 1">ANNA</span>
        <span style="align-self: flex-start; background: #FF48B0; color: #F2EEE4; padding: 2px 10px; font-size: 14px; font-weight: 700; letter-spacing: 2px">TEAM ROT</span>
      </div>
      <span style="font-size: 14px; font-weight: 700">Frage 3</span>
    </header>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
      <div style="position: relative; width: 300px; height: 300px">
        <span style="position: absolute; left: 14px; top: 10px; width: 280px; height: 280px; border-radius: 50%; background: #3255A4; mix-blend-mode: multiply"></span>
        <button type="button" style="position: absolute; left: 0; top: 0; width: 280px; height: 280px; border-radius: 50%; border: none; background: #FF48B0; mix-blend-mode: multiply; color: #F2EEE4; font-family: 'Bowlby One', sans-serif; font-size: 64px; cursor: pointer">BUZZ</button>
      </div>
      <span style="font-size: 16px; font-weight: 700; letter-spacing: 2px">BUZZER OFFEN</span>
    </div>
    <footer style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: rgba(255,72,176,.18); padding: 8px 14px; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 700">ROT</span><span style="font-family: 'Bowlby One', sans-serif; font-size: 24px">120</span></div>
      <div style="background: rgba(50,85,164,.16); padding: 8px 14px; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 700">BLAU</span><span style="font-family: 'Bowlby One', sans-serif; font-size: 24px">85</span></div>
    </footer>
  </div>
  <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; left: 0; top: 0; pointer-events: none; mix-blend-mode: multiply"><filter id="riso-grain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.25  0 0 0 0.28 0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#riso-grain)"></rect></svg>
</div>
</body>
</html>
