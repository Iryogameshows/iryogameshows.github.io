<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Salon · Handy Buzzer · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&amp;family=Jost:wght@400;500&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(ellipse 90% 60% at 50% 50%, #13392C 0%, #0C2A20 60%, #06170F 100%); color: #F4EEDF; font-family: 'Jost', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 34px 28px 32px; gap: 18px; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 12px; border: 1px solid rgba(201,165,76,.45); border-radius: 6px; pointer-events: none"></div>
  <header style="width: 100%; display: flex; justify-content: space-between; align-items: flex-end; position: relative">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: 4px; color: #FF9A92">TEAM ROT</span>
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 44px; line-height: 1">Anna</span>
    </div>
    <span style="font-size: 12px; font-weight: 500; letter-spacing: 3px; color: #9DB5A8">FRAGE 3</span>
  </header>
  <span style="width: 100%; height: 1px; background: rgba(201,165,76,.5); position: relative"></span>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; position: relative">
    <div style="width: 290px; height: 290px; border-radius: 50%; background: repeating-conic-gradient(#F4EEDF 0deg 10deg, #8E1B2C 10deg 30deg); box-shadow: 0 18px 30px rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center">
      <div style="width: 236px; height: 236px; border-radius: 50%; background: #8E1B2C; box-shadow: 0 0 0 1px #E6CF8B inset; display: flex; align-items: center; justify-content: center">
        <button type="button" style="width: 196px; height: 196px; border-radius: 50%; border: 1px solid #C9A54C; background: #F4EEDF; box-shadow: 0 0 0 6px #F4EEDF, 0 0 0 7px rgba(201,165,76,.7); color: #8E1B2C; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 64px; cursor: pointer">Buzz</button>
      </div>
    </div>
    <span style="font-size: 13px; font-weight: 500; letter-spacing: 4px; color: #E6CF8B">BUZZER OFFEN</span>
  </div>
  <footer style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: repeating-conic-gradient(#F4EEDF 0deg 11deg, #E8453C 11deg 45deg); display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 50%; background: #E8453C"></span></span>
      <span style="font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 30px">120</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px">
      <span style="font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 30px">85</span>
      <span style="width: 40px; height: 40px; border-radius: 50%; background: repeating-conic-gradient(#F4EEDF 0deg 11deg, #3B82F6 11deg 45deg); display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 50%; background: #3B82F6"></span></span>
    </div>
  </footer>
</div>
</body>
</html>
