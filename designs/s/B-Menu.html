<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Arcade · Menü · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #0B0A12; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 44px 64px 40px; gap: 26px; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 4px); pointer-events: none"></div>
  <header style="display: flex; justify-content: space-between; align-items: flex-end; position: relative">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: 72px; line-height: 1; color: #FFE14D; text-shadow: 6px 6px 0 #FF3D9A">IRYO</h1>
      <span style="font-family: 'Press Start 2P', monospace; font-size: 16px; letter-spacing: 6px; color: #2EE6D6">GAMESHOW ARCADE</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px; font-family: 'Press Start 2P', monospace; font-size: 14px">
      <span style="color: #9C96B8">CREDITS 08</span>
      <span style="color: #FF3D9A">1P READY</span>
    </div>
  </header>
  <div style="display: flex; align-items: center; gap: 16px; position: relative">
    <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FF3D9A">SELECT GAME</span>
    <span style="flex: 1; height: 3px; background: #2B2740"></span>
  </div>
  <main style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; position: relative">
    
      <button type="button" style="height: 186px; box-sizing: border-box; text-align: left; background: #14121F; border: 3px solid #2EE6D6; box-shadow: 0 0 28px rgba(46,230,214,.45); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFE14D">01</span>
        <span style="font-size: 25px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Family Feud</span>
        <span style="margin-top: auto; font-size: 14px; line-height: 1.35; font-weight: 500; color: #9C96B8">Teams raten Umfrageantworten</span>
        
          <span style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #2EE6D6">PRESS START</span>
        
      </button>
    
      <button type="button" style="height: 186px; box-sizing: border-box; text-align: left; background: #14121F; border: 3px solid #2B2740; box-shadow: 6px 6px 0 #000000; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFE14D">02</span>
        <span style="font-size: 25px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Jeopardy</span>
        <span style="margin-top: auto; font-size: 14px; line-height: 1.35; font-weight: 500; color: #9C96B8">Kategorien &amp; Punktefelder</span>
        
      </button>
    
      <button type="button" style="height: 186px; box-sizing: border-box; text-align: left; background: #14121F; border: 3px solid #2B2740; box-shadow: 6px 6px 0 #000000; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFE14D">03</span>
        <span style="font-size: 25px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Wer wird Millionär</span>
        <span style="margin-top: auto; font-size: 14px; line-height: 1.35; font-weight: 500; color: #9C96B8">15 Fragen, 4 Antworten, Joker</span>
        
      </button>
    
      <button type="button" style="height: 186px; box-sizing: border-box; text-align: left; background: #14121F; border: 3px solid #2B2740; box-shadow: 6px 6px 0 #000000; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFE14D">04</span>
        <span style="font-size: 25px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Wer weiß denn sowas</span>
        <span style="margin-top: auto; font-size: 14px; line-height: 1.35; font-weight: 500; color: #9C96B8">12 Kategorien, 3 Antworten, Masterfrage</span>
        
      </button>
    
      <button type="button" style="height: 186px; box-sizing: border-box; text-align: left; background: #14121F; border: 3px solid #2B2740; box-shadow: 6px 6px 0 #000000; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFE14D">05</span>
        <span style="font-size: 25px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Der Dümmste fliegt</span>
        <span style="margin-top: auto; font-size: 14px; line-height: 1.35; font-weight: 500; color: #9C96B8">Leben, Abstimmung, letzter bleibt</span>
        
      </button>
    
      <button type="button" style="height: 186px; box-sizing: border-box; text-align: left; background: #14121F; border: 3px solid #2B2740; box-shadow: 6px 6px 0 #000000; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFE14D">06</span>
        <span style="font-size: 25px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Der Preis ist heiß</span>
        <span style="margin-top: auto; font-size: 14px; line-height: 1.35; font-weight: 500; color: #9C96B8">Preise schätzen, näher dran gewinnt</span>
        
      </button>
    
      <button type="button" style="height: 186px; box-sizing: border-box; text-align: left; background: #14121F; border: 3px solid #2B2740; box-shadow: 6px 6px 0 #000000; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFE14D">07</span>
        <span style="font-size: 25px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Trivial Pursuit</span>
        <span style="margin-top: auto; font-size: 14px; line-height: 1.35; font-weight: 500; color: #9C96B8">Sechs Kategorien, sechs Tortenstücke</span>
        
      </button>
    
      <button type="button" style="height: 186px; box-sizing: border-box; text-align: left; background: #14121F; border: 3px solid #2B2740; box-shadow: 6px 6px 0 #000000; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; color: #EEEAFE; font-family: 'Space Grotesk', sans-serif; cursor: pointer">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFE14D">08</span>
        <span style="font-size: 25px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Turnier</span>
        <span style="margin-top: auto; font-size: 14px; line-height: 1.35; font-weight: 500; color: #9C96B8">Mehrtägig, gleiche Teams, Gewichtung</span>
        
      </button>
    
  </main>
  <nav style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: auto; position: relative">
    
      <button type="button" style="height: 46px; padding: 0 18px; border: 3px solid #2B2740; background: #0B0A12; color: #EEEAFE; font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer">BESTENLISTE</button>
    
      <button type="button" style="height: 46px; padding: 0 18px; border: 3px solid #2B2740; background: #0B0A12; color: #EEEAFE; font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer">SPIELER</button>
    
      <button type="button" style="height: 46px; padding: 0 18px; border: 3px solid #2B2740; background: #0B0A12; color: #EEEAFE; font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer">MAINSCREEN</button>
    
      <button type="button" style="height: 46px; padding: 0 18px; border: 3px solid #2B2740; background: #0B0A12; color: #EEEAFE; font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer">NOTIZEN</button>
    
      <button type="button" style="height: 46px; padding: 0 18px; border: 3px solid #2B2740; background: #0B0A12; color: #EEEAFE; font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer">SOUND AN</button>
    
      <button type="button" style="height: 46px; padding: 0 18px; border: 3px solid #2B2740; background: #0B0A12; color: #EEEAFE; font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer">TÖNE</button>
    
  </nav>
</div>
</body>
</html>
