<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Bauhaus · Handy Buzzer · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ECEAE4; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; display: flex; flex-direction: column; padding: 32px 26px 30px; gap: 20px; overflow: hidden">
  <header style="display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-weight: 800; font-size: 46px; line-height: .9; letter-spacing: -2px">Anna</span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800"><span style="width: 14px; height: 14px; border-radius: 50%; background: #E8453C"></span>Team Rot</span>
    </div>
    <span style="font-size: 15px; font-weight: 800; border: 2px solid #141414; padding: 4px 10px">Frage 3</span>
  </header>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 320px; height: 320px">
      <span style="position: absolute; right: 0; top: 0; width: 120px; height: 120px; background: #1F4FA3"></span>
      <span style="position: absolute; left: 0; bottom: 0; width: 110px; height: 110px; border-radius: 0 0 0 110px; background: #141414"></span>
      <button type="button" style="position: absolute; left: 30px; top: 30px; width: 260px; height: 260px; border-radius: 50%; border: none; background: #F2C230; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; letter-spacing: -2px; cursor: pointer">buzz</button>
    </div>
  </div>
  <span style="align-self: center; font-size: 16px; font-weight: 800">Buzzer offen</span>
  <footer style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; border: 2px solid #141414; padding: 8px 12px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #E8453C"></span><span style="font-weight: 800; font-size: 26px">120</span></div>
    <div style="display: flex; align-items: center; gap: 10px; border: 2px solid #141414; padding: 8px 12px"><span style="width: 20px; height: 20px; background: #3B82F6"></span><span style="font-weight: 800; font-size: 26px">85</span></div>
  </footer>
</div>
