<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Art déco · Trivial Pursuit · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,800;1,6..96,600&amp;family=Josefin+Sans:wght@400;600&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}</style>
</head>
<body>
<div style="position: relative; width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; background: #0C0B09; color: #EFE6D2; font-family: 'Josefin Sans', sans-serif">
  <div style="position: absolute; left: 340px; top: -320px; width: 600px; height: 600px; border-radius: 50%; background: repeating-conic-gradient(from 90deg, rgba(217,182,107,.14) 0deg 1.2deg, transparent 1.2deg 9deg); -webkit-mask-image: radial-gradient(circle, #000 35%, transparent 70%); mask-image: radial-gradient(circle, #000 35%, transparent 70%)"></div>
  <div style="position: absolute; inset: 12px; border: 1px solid rgba(217,182,107,.45); pointer-events: none"></div>
  <div style="position: absolute; inset: 18px; border: 1px solid rgba(217,182,107,.18); pointer-events: none"></div>
  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 34px 60px 32px"><div style="display: flex; align-items: center; justify-content: center; gap: 14px"><span style="width: 70px; height: 5px; border-top: 1px solid #D9B66B; border-bottom: 1px solid #D9B66B"></span><span style="width: 8px; height: 8px; border: 1px solid #D9B66B; transform: rotate(45deg)"></span><span style="font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 6px; color: #D9B66B">TRIVIAL PURSUIT · TEAM ROT AM ZUG</span><span style="width: 8px; height: 8px; border: 1px solid #D9B66B; transform: rotate(45deg)"></span><span style="width: 70px; height: 5px; border-top: 1px solid #D9B66B; border-bottom: 1px solid #D9B66B"></span></div><div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 40px; align-items: center">
      <div style="position: relative; width: 380px; height: 380px; justify-self: center">
        <div style="width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#3B82F6 0deg 60deg, #EC4899 60deg 120deg, #FFD23F 120deg 180deg, #A16207 180deg 240deg, #22C55E 240deg 300deg, #F97316 300deg 360deg); box-shadow: 0 12px 30px rgba(0,0,0,.45); transform: rotate(-12deg)"></div>
        <div style="position: absolute; left: 140px; top: 140px; width: 100px; height: 100px; border-radius: 50%; background: #111111; box-shadow: 0 0 0 6px rgba(255,255,255,.85)"></div>
        <div style="position: absolute; left: 170px; top: -14px; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 34px solid #EFE6D2"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 22px; min-width: 0">
        <span style="display: flex; align-items: center; gap: 12px; font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 20px"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFD23F"></span>Geschichte</span>
        <h2 style="margin: 0; font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 600; font-size: 48px; line-height: 1.1; text-align: center">In welchem Jahr fiel die Berliner Mauer?</h2>
        <div style="display: flex; gap: 44px; flex-wrap: wrap"><div style="display: flex; align-items: center; gap: 14px"><div style="width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(#3B82F6 0deg 60deg, #3A2F1A 60deg 120deg, #FFD23F 120deg 180deg, #3A2F1A 180deg 240deg, #22C55E 240deg 300deg, #F97316 300deg 360deg); box-shadow: 0 0 0 3px #E8453C"></div><div style="display: flex; flex-direction: column"><span style="font-family: 'Bodoni Moda', serif; font-weight: 800; font-size: 30px; line-height: 1.1">Team Rot</span><span style="font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 15px; opacity: .75">4 von 6 Stücken</span></div></div><div style="display: flex; align-items: center; gap: 14px"><div style="width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(#3A2F1A 0deg 60deg, #EC4899 60deg 120deg, #3A2F1A 120deg 180deg, #A16207 180deg 240deg, #3A2F1A 240deg 300deg, #3A2F1A 300deg 360deg); box-shadow: 0 0 0 3px #3B82F6"></div><div style="display: flex; flex-direction: column"><span style="font-family: 'Bodoni Moda', serif; font-weight: 800; font-size: 30px; line-height: 1.1">Team Blau</span><span style="font-family: 'Josefin Sans', sans-serif; font-weight: 600; font-size: 15px; opacity: .75">2 von 6 Stücken</span></div></div></div>
      </div>
    </div></div></div>
</body>
</html>
