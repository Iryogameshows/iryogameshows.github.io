<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Comic · Handy Buzzer · Iryo Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Nunito:wght@600;800&amp;display=swap">
<style>html,body{margin:0;background:#000}body{overflow:hidden}[style*="Bangers"]{text-transform:uppercase}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #FFE600; background-image: radial-gradient(rgba(0,0,0,.09) 2.2px, transparent 2.4px); background-size: 12px 12px; color: #111111; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 26px 22px 30px; gap: 20px; overflow: hidden">
  <header style="width: 100%; box-sizing: border-box; background: #FFFFFF; border: 4px solid #111111; box-shadow: 5px 5px 0 #111111; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column">
      <span style="font-family: 'Bangers', cursive; font-size: 32px; letter-spacing: 2px; line-height: 1">Anna</span>
      <span style="font-size: 14px; font-weight: 800; color: #B42318">Team Rot</span>
    </div>
    <span style="font-family: 'Bangers', cursive; font-size: 20px; letter-spacing: 1px">Frage 3</span>
  </header>
  <div style="position: relative; background: #FFFFFF; border: 4px solid #111111; border-radius: 30px; padding: 8px 22px; font-family: 'Bangers', cursive; font-size: 24px; letter-spacing: 2px">Buzzer ist offen!</div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 340px; height: 340px; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; inset: 0; background: #111111; clip-path: polygon(50% 0%, 60% 20%, 82% 8%, 80% 32%, 100% 40%, 84% 56%, 98% 78%, 74% 78%, 70% 100%, 50% 86%, 30% 100%, 26% 78%, 2% 78%, 16% 56%, 0% 40%, 20% 32%, 18% 8%, 40% 20%)"></div>
      <button type="button" style="position: relative; width: 250px; height: 250px; border-radius: 50%; border: 6px solid #111111; background: #E8453C; color: #FFFFFF; font-family: 'Bangers', cursive; font-size: 78px; letter-spacing: 3px; -webkit-text-stroke: 2px #111111; cursor: pointer">BUZZ!</button>
    </div>
  </div>
  <footer style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="background: #E8453C; color: #FFFFFF; border: 4px solid #111111; padding: 4px 14px; display: flex; justify-content: space-between; align-items: center; font-family: 'Bangers', cursive; font-size: 26px; letter-spacing: 1px"><span>Rot</span><span>120</span></div>
    <div style="background: #3B82F6; color: #FFFFFF; border: 4px solid #111111; padding: 4px 14px; display: flex; justify-content: space-between; align-items: center; font-family: 'Bangers', cursive; font-size: 26px; letter-spacing: 1px"><span>Blau</span><span>85</span></div>
  </footer>
</div>
</body>
</html>
