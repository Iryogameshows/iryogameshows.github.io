name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # Ohne dies bleibt eine Aenderung an js/ oder styles.css bei Besuchern
      # haengen, die die Seite schon einmal offen hatten: index.html wird neu
      # geholt, die verlinkten Dateien aber aus dem Cache. Das hat hier
      # zweimal dazu gefuehrt, dass eine fertige Aenderung "nicht da" war.
      # Die Commit-ID haengt als ?v= an jedem Pfad - neuer Commit, neue URL,
      # neuer Abruf. Geaendert wird nur die ausgecheckte Kopie im Lauf, nicht
      # das Repo.
      - name: Cache-Buster an die Asset-Pfade haengen
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(src=\"js/[A-Za-z0-9._-]+\.js)\"#\1?v=$V\"#g" index.html
          sed -i -E "s#(href=\"styles\.css)\"#\1?v=$V\"#g" index.html
          # Beamerfenster: seine eigenen Skripte (GSAP-Aufdecken) ebenso.
          sed -i -E "s#(src=\"aufdecken\.js)\"#\1?v=$V\"#g" mainscreen/index.html
          echo "Version $V gesetzt:"
          grep -o "?v=[0-9a-f]*" index.html | sort -u
      # Nur hochladen, was eine Seite tatsaechlich laedt. Notizen, Pruef- und
      # Bauwerkzeuge und der graphify-Cache bleiben im Repo, landen aber nicht
      # auf Pages (vorher rund 1,3 MB, u. a. 707 KB graphify-out, 394 KB
      # HANDOFF.md). Wie beim Cache-Buster: nur die Kopie im Lauf, nicht das Repo.
      # NICHT entfernen: designs/ (Theme-Galerie in js/theme.js, Voting-Seite),
      # tools/intros/ (Intro-Labor, laeuft bewusst live), .nojekyll (siehe unten).
      - name: Nicht ausgelieferte Dateien aus dem Upload nehmen
        run: |
          rm -rf graphify-out .claude types tools/shots tools/reactbits
          rm -f ./*.md check.js jsconfig.json firebase.json database.rules.json .gitignore
          test -f .nojekyll && test -d designs && test -d tools/intros
          echo "Bleibt im Upload:"; ls -A
          du -sh --exclude=.git --exclude=.github .
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          # Ab v4 schliesst die Action Punktdateien aus (--exclude=.[^/]*).
          # Ohne diese Zeile fiele .nojekyll aus dem Deploy - die Datei schaltet
          # die Jekyll-Verarbeitung ab, und ohne sie wuerde GitHub Pages die
          # Seite durch einen Generator schicken, der Dateien mit _ oder . am
          # Anfang verwirft.
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
