name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          # Ab v4 schliesst die Action Punktdateien aus (--exclude=.[^/]*).
          # Ohne diese Zeile fiele .nojekyll aus dem Deploy - die Datei schaltet
          # die Jekyll-Verarbeitung ab, und ohne sie wuerde GitHub Pages die
          # Seite durch einen Generator schicken, der Dateien mit _ oder . am
          # Anfang verwirft.
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
