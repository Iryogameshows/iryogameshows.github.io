<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fallblatt</title>
<!-- Intro "Fallblatt": die große Anzeigetafel im Bahnhof. Gong, die Tafel
     rattert los, jedes Feld blättert durch zufällige Zeichen und bleibt
     eins nach dem anderen stehen - bis DIE GROSSE / KELLER / GAMESHOW
     dasteht und darunter: 20:00 · GLEIS 1 · BITTE EINSTEIGEN.

     Das Blättern ist pro Feld eine kurze Folge: Zeichen tauschen, die obere
     Hälfte klappt herunter (scaleY), ein Klick. Die Felder einer Zeile
     bleiben von links nach rechts stehen, wie bei der echten Tafel. -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lab.css">
<style>
  :root{--lab-akzent:#ffd24d;--lab-grund:#0c0d10;--lab-text:#e8e8e8;}
  html,body{margin:0;height:100%;background:#0c0d10;overflow:hidden;}
  #halle{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 40%,#1b1e26,#07080a 75%);}
  #tafel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:3vh 3vw 3.4vh;border-radius:1.4vh;
    background:linear-gradient(#17181c,#0b0b0d);box-shadow:0 0 0 .6vh #2a2c33,0 3vh 8vh rgba(0,0,0,.8),inset 0 0 4vh rgba(0,0,0,.8);}
  .kopf{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.2vh;font:700 clamp(12px,1.25vw,20px) Inter,sans-serif;letter-spacing:.3em;color:#e8e8e8;text-transform:uppercase;}
  .kopf .uhr{color:#ffd24d;letter-spacing:.12em;}
  .reihe{display:flex;justify-content:center;gap:.45vw;margin:.9vh 0;}
  .feld{position:relative;width:min(4.4vw,7.6vh);height:min(6.6vw,11.4vh);border-radius:.5vh;overflow:hidden;
    background:linear-gradient(#2a2c32 0 49.5%,#000 49.5% 50.5%,#25272c 50.5%);box-shadow:inset 0 .3vh .4vh rgba(255,255,255,.06),0 .3vh .6vh rgba(0,0,0,.6);}
  .feld span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 min(4.6vw,8vh)/1 Oswald,sans-serif;color:#f2f2ea;transform-origin:50% 50%;}
  .feld.gold span{color:#ffd24d;}
  .klein .feld{width:min(2.2vw,3.8vh);height:min(3.3vw,5.7vh);}
  .klein .feld span{font-size:min(2.3vw,4vh);}
  .klein{margin-top:2.6vh;}
  .lampe{display:inline-block;width:1.4vh;height:1.4vh;border-radius:50%;background:#3a2a0a;margin-right:1vh;vertical-align:middle;}
  .los{position:absolute;bottom:6vh;left:0;right:0;text-align:center;font:700 13px Inter,sans-serif;letter-spacing:.45em;color:#e8e8e8;opacity:0;text-transform:uppercase;}
</style>
</head>
<body>
<div id="halle"></div>
<div class="lab-korn" style="z-index:9;opacity:.05"></div>
<script src="../../../vendor/gsap.min.js"></script>
<script src="../lab.js"></script>
<script>
const { SHOW, esc } = Lab;
const R = gsap.utils.random;
const ZEICHEN = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ0123456789·-';
const BREIT = 14, KLEIN = 28;
const T = { gong: .3, los: 1.6, info: 6.4 };
let klickZeiten = [];

function mitte(text, breite){
  const t = text.toUpperCase().slice(0, breite), links = Math.floor((breite - t.length) / 2);
  return (' '.repeat(links) + t).padEnd(breite, ' ');
}
function aufbauen(){
  klickZeiten = [];
  const [ta, tb] = [SHOW.titel.split(' ')[0], SHOW.titel.split(' ').slice(1).join(' ')];
  const reihen = [mitte(SHOW.titelKlein, BREIT), mitte(ta, BREIT), mitte(tb, BREIT)];
  const info = mitte('20:00 · Gleis 1 · Einsteigen', KLEIN);
  const reihe = (text, gold, klein) => `<div class="reihe${klein ? ' klein' : ''}">${Array.from(text).map(c => `<div class="feld${gold && c !== ' ' ? ' gold' : ''}" data-ziel="${esc(c)}"><span> </span></div>`).join('')}</div>`;
  document.getElementById('halle').innerHTML = `
    <div id="tafel">
      <div class="kopf"><span><i class="lampe"></i>Abfahrt · Departures</span><span class="uhr" id="uhr">19:59</span></div>
      ${reihe(reihen[0], false)}${reihe(reihen[1], true)}${reihe(reihen[2], true)}
      ${reihe(info, false, true)}
    </div>
    <div class="los">Klicken, um zu beginnen</div>`;
}

/* Ein Feld blättert: n Zufallszeichen, dann das Ziel. */
function blaettern(tl, feld, start, n){
  const span = feld.querySelector('span'), ziel = feld.dataset.ziel;
  for (let k = 0; k <= n; k++){
    const t = start + k * .065;
    const c = k === n ? ziel : ZEICHEN[(Math.random() * ZEICHEN.length) | 0];
    tl.set(span, { textContent: c }, t)
      .fromTo(span, { scaleY: .15, y: '-22%', filter: 'brightness(.6)' }, { scaleY: 1, y: '0%', filter: 'brightness(1)', duration: .055, ease: 'none', immediateRender: false }, t);
    if (k % 2 === 0) klickZeiten.push(t);
  }
  return start + n * .065;
}

function bauen(tl){
  tl.fromTo('#tafel', { opacity: 0, scale: .96 }, { opacity: 1, scale: 1, duration: 1, ease: 'power2.out' }, 0)
    .to('.lampe', { background: '#ffd24d', boxShadow: '0 0 1.4vh #ffd24d', duration: .2 }, T.gong);
  const reihen = [...document.querySelectorAll('#tafel .reihe')];
  /* Die drei großen Reihen: alle Felder rattern gleichzeitig los, bleiben
     aber Reihe für Reihe und von links nach rechts stehen. */
  reihen.slice(0, 3).forEach((r, ri) => {
    [...r.children].forEach((f, i) => {
      if (f.dataset.ziel === ' ') return;
      blaettern(tl, f, T.los + R(0, .15), 16 + ri * 14 + i * 2 + ((Math.random() * 3) | 0));
    });
  });
  const ende = T.los + (16 + 2 * 14 + 13 * 2 + 2) * .065;
  [...reihen[3].children].forEach((f, i) => { if (f.dataset.ziel !== ' ') blaettern(tl, f, T.info + i * .03, 6 + ((Math.random() * 4) | 0)); });
  tl.set('#uhr', { textContent: '20:00' }, T.info)
    .fromTo('#uhr', { opacity: .2 }, { opacity: 1, duration: .3, immediateRender: false }, T.info)
    .fromTo('.feld.gold', { boxShadow: '0 0 0 rgba(255,210,77,0)' }, { boxShadow: '0 0 2.4vh rgba(255,210,77,.55)', duration: .5, stagger: .03, immediateRender: false }, ende + .2)
    .fromTo('#tafel', { scale: 1 }, { scale: 1.03, duration: 2, yoyo: true, repeat: 2, ease: 'sine.inOut', immediateRender: false }, ende + .6)
    .fromTo('.los', { opacity: 0 }, { opacity: .8, duration: .8, yoyo: true, repeat: 5, ease: 'sine.inOut' }, T.info + 1.4);
}

function ton(t0, A){
  /* Bahnhofsgong: drei Töne abwärts */
  [[784, 0], [659.25, .55], [523.25, 1.1]].forEach(([f, d]) => { A.ping(t0 + T.gong + d, f, .14, 2.4); A.ping(t0 + T.gong + d, f * 2, .03, 1.4); });
  const hall = A.huelle(t0, .8, .05, 14, 2); A.rauschen(t0, 17, A.filter('bandpass', 400, .5, hall));
  klickZeiten.forEach(t => A.klick(t0 + t, .05, R(1100, 2200)));
  const ende = T.los + (16 + 2 * 14 + 13 * 2 + 2) * .065;
  A.tusch(t0 + ende + .2, [261.63, 329.63, 392, 523.25], .7);
  [[523.25, 0], [659.25, .55], [784, 1.1]].forEach(([f, d]) => A.ping(t0 + T.info + 1 + d, f, .12, 2.2));
  A.flaeche(t0 + ende, [130.81, 196, 261.63, 329.63], 9, .035, 1300, 1);
}
Lab.starte({ name: 'Fallblatt', aufbauen, bauen, ton });
</script>
</body>
</html>
